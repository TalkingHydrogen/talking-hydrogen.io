<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex"><title>In-App Lab A5</title><script>window.PAGE={"id": "a5", "idle": "Ready.", "outside": "Open This From LinkedIn To Test It."};window.VIA_NAMES={"a1": "A1 · On Load, Scripted", "a1m": "A1m · On Load, Meta Refresh", "a2": "A2 · First Tap, Real Link", "a2s": "A2s · First Tap, Script", "a3": "A3 · Swipe Up", "a3n": "A3n · Scroll The Feed", "a4": "A4 · Quiet Link", "a0": "A0 · Control", "a1i": "A1i · On Load, Hidden Frame", "a5": "A5 · Old Safari Scheme", "a6": "A6 · window.open", "a7": "A7 · New Window", "r": "R · Recommended Cascade"};</script><script>/* In-app → Safari lab core. Inlined as the FIRST script in <head> of every page (window.PAGE is set just before it),
   so the on-load tests can fire before anything renders. Exposes window.lab.
   URL params: ?dry (scheme replaced by one nothing handles: smoke tests), ?force (act in any browser),
   ?grace=ms (how long to wait for a sign of leaving, default 2000), ?run=… (cache-buster for "Run Again").
   A landing page carries ?via=<test>&at=<ms epoch of the attempt>&from=<app key> — set by the test that sent it. */
(function () {
  'use strict';
  var P = window.PAGE || { id: 'index' };
  var ua = navigator.userAgent;
  var qs = new URLSearchParams(location.search);
  var DRY = qs.has('dry'), FORCE = qs.has('force');
  var GRACE = +(qs.get('grace') || 2000);
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
  var NAVTYPE = nav ? nav.type : 'navigate';
  var VIA = qs.get('via'), AT = +qs.get('at') || 0, FROM = qs.get('from');
  var KEY = 'inapp:' + P.id;
  var LINES = [], state = { v: 'idle', text: '' }, ready = false, attempts = 0;

  /* ---------- who is showing this page ---------- */
  var IOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var APPS = [
    ['threads', /Barcelona/i, 'Threads'], ['instagram', /Instagram/i, 'Instagram'],
    ['messenger', /FBAN\/Messenger|MessengerForiOS|MessengerLite/i, 'Messenger'],
    ['facebook', /FBAN|FBAV|FBIOS|FB_IAB|FB4A|MetaIAB|\bFacebook\b/i, 'Facebook'],
    ['linkedin', /LinkedInApp/i, 'LinkedIn'], ['x', /Twitter/i, 'X'],
    ['tiktok', /musical_ly|Bytedance|TikTok/i, 'TikTok'], ['snapchat', /Snapchat/i, 'Snapchat'],
    ['pinterest', /Pinterest/i, 'Pinterest'], ['line', /\bLine\//i, 'LINE'], ['wechat', /MicroMessenger/i, 'WeChat'],
    ['kakao', /KAKAOTALK/i, 'KakaoTalk'], ['whatsapp', /WAiOS|WhatsApp/i, 'WhatsApp'], ['reddit', /Reddit\//i, 'Reddit'],
    ['google', /GSA\//, 'Google app'], ['discord', /Discord/i, 'Discord'], ['slack', /\bSlack\b/i, 'Slack']
  ];
  function classify() {
    var i, a;
    for (i = 0; i < APPS.length; i++) {
      a = APPS[i];
      if (a[1].test(ua)) return { key: a[0], name: a[2], sub: 'In-App Browser', inApp: true };
    }
    if (window.TelegramWebviewProxy) return { key: 'telegram', name: 'Telegram', sub: 'In-App Browser', inApp: true };
    if (navigator.standalone) return { key: 'webapp', name: 'Home Screen App', sub: 'Standalone Web App', inApp: false };
    if (/CriOS\//.test(ua)) return { key: 'chrome', name: 'Chrome', sub: 'Browser', inApp: false };
    if (/FxiOS\//.test(ua)) return { key: 'firefox', name: 'Firefox', sub: 'Browser', inApp: false };
    if (/EdgiOS\//.test(ua)) return { key: 'edge', name: 'Edge', sub: 'Browser', inApp: false };
    if (/OPiOS\/|OPT\//.test(ua)) return { key: 'opera', name: 'Opera', sub: 'Browser', inApp: false };
    if (/DuckDuckGo|Ddg\//.test(ua)) return { key: 'ddg', name: 'DuckDuckGo', sub: 'Browser', inApp: false };
    if (IOS && /Version\/[\d.]+ (Mobile\/\S+ )?Safari\/\S+$/.test(ua)) return { key: 'safari', name: 'Safari', sub: 'Browser', inApp: false };
    if (IOS && !/Safari\//.test(ua)) return { key: 'webview', name: 'An App’s Web View', sub: 'WKWebView, Unknown App', inApp: true };
    if (/Macintosh/.test(ua) && /Version\/[\d.]+ Safari\//.test(ua)) return { key: 'safari-mac', name: 'Safari', sub: 'Mac', inApp: false };
    return { key: 'other', name: 'Another Browser', sub: 'Not iPhone Safari', inApp: false };
  }
  var C = classify();
  var IOSV = (ua.match(/OS (\d+(?:_\d+)*) like Mac/) || [])[1];
  IOSV = IOSV ? IOSV.replace(/_/g, '.') : null;
  var APPV = (ua.match(/LinkedInApp\]?\/([\d.]+)/) || ua.match(/Instagram ([\d.]+)/) || ua.match(/FBAV\/([\d.]+)/) || [])[1] || null;

  /* ---------- log ---------- */
  function fmt(ms) { return (ms / 1000).toFixed(2) + ' s'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function log(msg, cls) {
    var line = { t: performance.now(), msg: msg, cls: cls || '' };
    LINES.push(line);
    if (ready) paintLine(line);
    save();
  }
  function paintLine(l) {
    var ol = document.getElementById('log'); if (!ol) return;
    var li = document.createElement('li'); if (l.cls) li.className = l.cls;
    li.innerHTML = '<b>' + fmt(l.t) + '</b> ' + esc(l.msg);
    ol.appendChild(li);
  }
  function save() {
    if (VIA || !(C.inApp || FORCE)) return;
    try { localStorage.setItem(KEY, JSON.stringify({ when: Date.now(), lines: LINES.map(function (l) { return fmt(l.t) + '  ' + l.msg; }) })); } catch (e) { }
  }
  var PREV = null;
  try { PREV = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { }

  /* ---------- verdict (the big coloured line) ---------- */
  function verdict(v, text) {
    state = { v: v, text: text };
    if (ready) paintVerdict();
  }
  function paintVerdict() {
    var el = document.getElementById('verdict'); if (!el) return;
    el.className = 'verdict ' + state.v;
    el.textContent = state.text;
  }

  /* ---------- the target: this very page, marked with how it was reached ---------- */
  function landing(via) {
    var u = new URL(location.href);
    ['dry', 'force', 'run', 'via', 'at', 'from', 'grace'].forEach(function (k) { u.searchParams.delete(k); });
    u.searchParams.set('via', via);
    u.searchParams.set('at', String(Date.now()));
    u.searchParams.set('from', C.key);
    return u.href;
  }
  function url(kind, via) {
    var h = landing(via);
    if (kind === 'x-safari') return (DRY ? 'x-brew-dry-' : 'x-safari-') + h;                        // x-safari-https://…
    if (kind === 'tab') return (DRY ? 'x-brew-dry-tab:' : 'com-apple-mobilesafari-tab:') + h;       // com-apple-mobilesafari-tab:https://…
    if (kind === 'bogus') return 'x-brew-nothing-' + h;                                              // nothing on iOS handles this
    return h;                                                                                        // plain https
  }

  /* ---------- did the page leave? four independent signals ---------- */
  function watch(label, opt) {
    opt = opt || {};
    var tA = performance.now(), left = false, settled = false, back = false, seen = {}, last = tA, weak = false;
    function leave(sig, strong) {
      var dt = performance.now() - tA;
      if (!seen[sig]) { seen[sig] = 1; log(sig + ' — ' + fmt(dt) + ' after the attempt', 'sig'); }
      if (!strong) { weak = true; return; }
      if (left) return;
      left = true;
      verdict('left', 'Left The Page After ' + fmt(dt) + (settled ? ' (Late)' : '') + ' — Did Safari Open?');
      if (opt.onLeft) opt.onLeft();
    }
    function onVis() { if (document.hidden) leave('visibilitychange → hidden', true); else if (left && !back) { back = true; log('visible again — back in the app after ' + fmt(performance.now() - tA), 'back'); } }
    function onHide() { leave('pagehide', true); }
    function onBlur() { leave('window blur', false); }
    function onFocus() { if (left || weak) log('window focus (+' + fmt(performance.now() - tA) + ')', 'back'); }
    document.addEventListener('visibilitychange', onVis);
    addEventListener('pagehide', onHide);
    addEventListener('blur', onBlur);
    addEventListener('focus', onFocus);
    var iv = setInterval(function () {
      var n = performance.now();
      if (n - last > 900) leave('timers stalled ' + fmt(n - last) + ' (the app was in the background)', true);
      last = n;
    }, 250);
    setTimeout(function () {
      settled = true;
      var late = performance.now() - tA > GRACE + 700;
      if (late && !left) leave('grace timer fired ' + fmt(performance.now() - tA - GRACE) + ' late (the app was in the background)', true);
      if (!left && !document.getElementById('log')) {   // the attempt stopped the page loading (blank page): reload once, quietly
        log('the page stopped loading (no body) — reloading once, without firing', 'no');
        location.reload(); return;
      }
      if (!left) {
        if (weak) verdict('weak', 'Only Lost Focus — Did A Dialog Appear?');
        else verdict('stayed', 'Stayed Here — The App Ignored It');
        log('no sign of leaving within ' + fmt(GRACE) + (weak ? ' (focus only)' : ''), 'no');
        if (opt.onIgnored) opt.onIgnored();
      }
    }, GRACE);
    setTimeout(function () { clearInterval(iv); }, 60000);
  }

  /* attempt(label, fn, opt): log it, run fn (the navigation) synchronously, then watch. */
  function attempt(label, fn, opt) {
    attempts++;
    log('try ' + label, 'try');
    verdict('trying', 'Trying…');
    try { if (fn) fn(); } catch (e) { log('threw: ' + (e && e.message || e), 'no'); }
    watch(label, opt);
  }

  /* on-load tests fire only on a fresh navigation in an in-app browser — never on a reload or a return,
     never on a landing page (a page that something already sent here). */
  function shouldAuto() {
    if (VIA) return false;
    if (!(C.inApp || FORCE)) return false;
    if (NAVTYPE !== 'navigate') { log('not firing: this load is a “' + NAVTYPE + '”, not a fresh navigation (tap Run Again)'); return false; }
    return true;
  }
  function armed() { return !VIA && (C.inApp || FORCE); }

  /* ---------- details ---------- */
  function insets() {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
    document.body.appendChild(d);
    var s = getComputedStyle(d), r = [s.paddingTop, s.paddingRight, s.paddingBottom, s.paddingLeft].map(function (v) { return parseFloat(v) || 0; }).join(' ');
    d.remove(); return r;
  }
  function orient() { return matchMedia('(orientation: landscape)').matches ? 'landscape' : 'portrait'; }
  function facts() {
    var dl = document.getElementById('facts'); if (!dl) return;
    var vv = window.visualViewport;
    var rows = [
      ['Browser', C.name + ' · ' + C.sub + (sfsvc ? ' · ' + sfsvc : '')],
      ['iOS', IOSV || '—'], ['App', APPV || '—'],
      ['Page', innerWidth + '×' + innerHeight + ' · ' + orient() + (vv ? ' · visual ' + Math.round(vv.width) + '×' + Math.round(vv.height) : '')],
      ['Screen', screen.width + '×' + screen.height + ' @' + devicePixelRatio + 'x'],
      ['Safe area', insets() + ' (t r b l)'],
      ['Arrived', NAVTYPE + ' · history ' + history.length + ' · referrer ' + (document.referrer || 'none')],
      ['WKWebView', (window.webkit && window.webkit.messageHandlers) ? 'webkit.messageHandlers present' : 'no messageHandlers'],
      ['Fullscreen', 'element ' + (document.fullscreenEnabled || document.webkitFullscreenEnabled ? 'yes' : 'no') + ' · standalone ' + (navigator.standalone ? 'yes' : 'no')],
      ['User agent', ua]
    ];
    dl.innerHTML = rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
  }

  /* Safari vs a Safari view inside an app (SFSafariViewController) — experimental, after inapp-spy:
     Safari 26.4+ has window.browser and the view does not; 17–26.3 Safari injects SchemaDataExtractor / MicrodataExtractor. */
  var sfsvc = '';
  function checkSFSVC() {
    if (C.key !== 'safari') return;
    var v = parseFloat((ua.match(/Version\/([\d.]+)/) || [])[1] || '0');
    if (v >= 26.4) { sfsvc = ('browser' in window && window.browser) ? 'real Safari (check)' : 'maybe a Safari view inside an app (experimental)'; paintHead(); facts(); return; }
    var t = 0, iv = setInterval(function () {
      t += 60;
      if (window.SchemaDataExtractor || window.MicrodataExtractor) { clearInterval(iv); sfsvc = 'real Safari (check)'; paintHead(); facts(); }
      else if (t > 400) { clearInterval(iv); sfsvc = 'maybe a Safari view inside an app (experimental)'; paintHead(); facts(); }
    }, 60);
  }

  var VIA_NAMES = window.VIA_NAMES || {};
  function paintHead() {
    var k = document.getElementById('kind'), s = document.getElementById('sub');
    if (k) k.textContent = C.name;
    if (s) s.textContent = C.sub + (IOSV ? ' · iOS ' + IOSV : '') + (APPV ? ' · app ' + APPV : '') + (sfsvc ? ' · ' + sfsvc : '');
  }

  /* ---------- landing ---------- */
  function landed() {
    if (!VIA) return;
    var how = (VIA_NAMES[VIA] || VIA);
    var dt = AT ? ' · ' + ((Date.now() - AT) / 1000).toFixed(1) + ' s after the attempt' : '';
    var from = FROM ? ' · sent from ' + (FROM === 'linkedin' ? 'LinkedIn' : FROM) : '';
    if (C.inApp) {
      verdict('stayed', 'Still Inside ' + C.name + ' — This Route Stays In The App');
      log('landed here via ' + how + dt + from + ' — but still inside ' + C.name, 'no');
    } else {
      verdict('arrived', 'You Are In ' + C.name);
      log('landed here via ' + how + dt + from, 'ok');
      if (location.hash) log('place kept: ' + decodeURIComponent(location.hash), 'ok');
      var td = document.querySelector('.todo');
      if (td) td.innerHTML = 'This is the result. Screenshot it, then go back with <b>‹ LinkedIn</b> (top left of the screen) for the next test.';
    }
  }

  function boot() {
    ready = true;
    document.documentElement.classList.toggle('armed', armed());
    paintHead();
    LINES.forEach(paintLine);
    landed();
    paintVerdict();
    facts();
    checkSFSVC();
    var pv = document.getElementById('prev');
    if (pv && PREV && PREV.lines && PREV.lines.length && !VIA && (Date.now() - PREV.when) < 6 * 3600e3 && NAVTYPE !== 'navigate') {
      pv.innerHTML = '<p>Last run here, ' + Math.round((Date.now() - PREV.when) / 1000) + ' s ago:</p><pre>' + esc(PREV.lines.join('\n')) + '</pre>';
    }
    var rs = document.getElementById('runAgain');
    if (rs && !armed()) rs.remove(), rs = null;
    if (rs) { var u = new URL(location.href); ['via', 'at', 'from'].forEach(function (k) { u.searchParams.delete(k); }); u.searchParams.set('run', Date.now().toString(36)); rs.href = u.pathname.split('/').pop() + u.search; }
    var lastO = orient();
    addEventListener('resize', function () {
      var o = orient();
      if (o !== lastO) { log('rotated → ' + o + ' ' + innerWidth + '×' + innerHeight, 'sig'); lastO = o; }
      facts();
    });
    if (window.PAGE_BOOT) window.PAGE_BOOT();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);

  log('page started · ' + C.name + (C.inApp ? ' (in-app)' : '') + ' · ' + NAVTYPE + (DRY ? ' · DRY' : '') + (FORCE ? ' · FORCE' : ''));
  if (!VIA) {
    if (C.inApp || FORCE) verdict('idle', P.idle || 'Ready.');
    else verdict('idle', P.outside || 'Open This From LinkedIn To Test It.');
  }

  window.lab = { C: C, ua: ua, log: log, verdict: verdict, url: url, landing: landing, attempt: attempt, watch: watch,
                 shouldAuto: shouldAuto, armed: armed, DRY: DRY, FORCE: FORCE, GRACE: GRACE, VIA: VIA, NAVTYPE: NAVTYPE,
                 get attempts() { return attempts; }, get state() { return state; }, get lines() { return LINES.map(function (l) { return fmt(l.t) + ' ' + l.msg; }); } };
})();
</script><style>:root{--bg:#fff;--ink:#1d1d1f;--mute:#86868b;--hair:#e5e5ea;--card:#f2f2f4;--card2:#e9e9ed;--ok:#248a3d;--no:#c93400;--warn:#b25000;--blue:#0071e3;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#f5f5f7;--mute:#98989d;--hair:#2c2c2e;--card:#1c1c1e;--card2:#242426;--ok:#30d158;--no:#ff6b3d;--warn:#ff9f0a;--blue:#2997ff}}
:root[data-theme="dark"]{--bg:#000;--ink:#f5f5f7;--mute:#98989d;--hair:#2c2c2e;--card:#1c1c1e;--card2:#242426;--ok:#30d158;--no:#ff6b3d;--warn:#ff9f0a;--blue:#2997ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px,env(safe-area-inset-left))}
.kicker{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--mute)}
h1{margin:0;font-size:48px;line-height:1.04;font-weight:700}
.sub{margin:6px 0 0;font-size:15px;color:var(--mute)}
.verdict{margin:22px 0 0;font-size:24px;line-height:1.15;font-weight:600}
.verdict.idle{color:var(--ink)}.verdict.trying{color:var(--mute)}.verdict.left{color:var(--ok)}.verdict.arrived{color:var(--ok)}
.verdict.stayed{color:var(--no)}.verdict.weak{color:var(--warn)}
.todo{margin:12px 0 0;font-size:15px;line-height:1.4;color:var(--mute)}
.todo b{color:var(--ink);font-weight:600}
.log{list-style:none;margin:18px 0 0;padding:12px 0 0;border-top:1px solid var(--hair);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);word-break:break-word}
.log b{display:inline-block;min-width:4.6em;font-weight:400;color:var(--mute)}
.log .try{color:var(--ink)}.log .sig,.log .ok{color:var(--ok)}.log .no{color:var(--no)}.log .back{color:var(--blue)}
.prev{font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute)}
.prev p{margin:14px 0 4px}.prev pre{margin:0;white-space:pre-wrap}
.nav{display:flex;gap:22px;margin:22px 0 0;font-size:15px}
.nav a{padding:6px 0}
.facts{margin:22px 0 0;font-size:13px;color:var(--mute)}
.facts summary{cursor:pointer;padding:6px 0}
.facts dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:6px 0 0;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.facts dt{color:var(--mute)}.facts dd{margin:0;color:var(--ink);word-break:break-word}
/* the invisible first-tap link (A2 / A5 / A7 / A0): covers the page only while armed */
.cover{position:fixed;inset:0;z-index:50;display:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html.armed .cover{display:block}
/* feed stand-in (A3n / R) */
.feed{margin:28px 0 0;display:grid;gap:14px}
.feed div{height:220px;border-radius:14px;background:var(--card)}
.feed div:nth-child(2n){background:var(--card2);height:260px}
.quiet{display:inline-block;margin:26px 0 0;font-size:13px;color:var(--mute)}
.quiet:active{opacity:.5}
/* swipe-up cue (A3) */
.cue{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 26px);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:13px;pointer-events:none}
.cue svg{width:22px;height:22px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}
.list{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--hair)}
.list li{border-bottom:1px solid var(--hair)}
.list a{display:block;padding:13px 0}
.list .t{display:block;color:var(--ink);font-size:17px;font-weight:600}
.list .d{display:block;margin-top:2px;color:var(--mute);font-size:14px;line-height:1.35}
.list .e{display:block;margin-top:3px;color:var(--mute);font-size:12px}
.how{margin:26px 0 0;font-size:15px;line-height:1.45;color:var(--mute)}
.how b{color:var(--ink);font-weight:600}
.how ol{margin:8px 0 0;padding-left:20px}
code{font:.86em/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
</style></head><body><a id="cover" class="cover" href="#" aria-label="Open In Safari"></a><main class="wrap"><p class="kicker">A5 · Old Safari Scheme</p><h1 id="kind">…</h1><p id="sub" class="sub"></p><p id="verdict" class="verdict"></p><p class="todo"><b>Tap anywhere</b> once.</p><ol id="log" class="log"></ol><div id="prev" class="prev"></div><nav class="nav"><a href="index.html">‹ All Tests</a><a href="a6.html">Next ›</a></nav><details class="facts"><summary>Details</summary><p>The first tap lands on <code>com-apple-mobilesafari-tab:https://…</code>.<br>Reported dead since iOS 17 (error -10814); Apple DTS calls it undocumented.</p><dl id="facts"></dl></details></main><script>window.PAGE_BOOT=function(){"use strict";
var c = document.getElementById('cover'), used = false;
if (!lab.armed()) return;
lab.verdict('idle', 'Tap Anywhere.');
c.addEventListener('click', function () {
  if (used) return; used = true;
  c.href = lab.url('tab', 'a5');
  lab.attempt('com-apple-mobilesafari-tab:https · first tap, a real <a href>');
  setTimeout(function () { document.documentElement.classList.remove('armed'); }, 80);   // one shot (a removed link would not navigate)
});
};</script></body></html>
