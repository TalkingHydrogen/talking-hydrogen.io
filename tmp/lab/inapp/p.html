<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>viktor dune</title><style>html.handoff body{visibility:hidden}.handoff-line{display:none}html.handoff-ignored .handoff-line{display:block}:root{color-scheme:light}html,body{background:#fff;color:#1d1d1f}body{margin:0;font:17px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}.w{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 16px 40px}h1{margin:0;font-size:28px;font-weight:600}.handoff-line{margin:8px 0 0;font-size:13px;color:#86868b}.cards{margin:28px 0 0;display:grid;gap:14px}.cards div{height:220px;border-radius:14px;background:#f2f2f4}.cards div:nth-child(2n){background:#e9e9ed;height:260px}</style><script>/* handoff — inside LinkedIn's in-app browser (iPhone), hand this same address to Safari. No UI.
   Paste as the FIRST inline <script> in <head>, with this rule in the first <style>:
     html.handoff body{visibility:hidden}          (the ~1.5 s while tier 1 runs: no flash of the feed)
     .handoff-line{display:none} html.handoff-ignored .handoff-line{display:block}   (tier 3, only if the app refuses everything)
   Tier 1: on arrival, no gesture.  Tier 2: the first tap or upward swipe.  Tier 3: one quiet line, revealed by CSS.
   Each tier runs only after the previous one was provably ignored: one browser, never two. */
(function () {
  var ua = navigator.userAgent;
  if (!/LinkedInApp/.test(ua) || !/iPhone|iPad|iPod/.test(ua)) return;   // allowlist; add apps only once a phone proved them
  var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
  if (nav && nav.type !== 'navigate') return;                            // never on a reload or a return: no loops
  try { if (sessionStorage.getItem('handoff')) return; sessionStorage.setItem('handoff', '1'); } catch (e) { }
  var root = document.documentElement, GRACE = 1500;

  function safari(place) {                                               // this same address (+ where the visitor is), in Safari
    return 'x-safari-' + location.href.split('#')[0] + (place ? '#' + place : location.hash);
  }
  function placeOf(el) {                                                 // adapt to the site's own deep links
    var p = el && el.closest && el.closest('[id]');
    return p && p !== document.body ? p.id : '';
  }
  // iOS reports nothing back when a hand-off works, and a WKWebView may not fire visibilitychange,
  // so: hidden, pagehide, or JS timers that stalled (the app was suspended) all count as "left".
  function watch(onIgnored) {
    var gone = false, t0 = performance.now(), last = t0;
    function mark() { gone = true; }
    function vis() { if (document.hidden) mark(); }
    document.addEventListener('visibilitychange', vis);
    addEventListener('pagehide', mark);
    var iv = setInterval(function () { var n = performance.now(); if (n - last > 900) mark(); last = n; }, 250);
    setTimeout(function () {
      clearInterval(iv);
      document.removeEventListener('visibilitychange', vis);
      removeEventListener('pagehide', mark);
      if (!gone && performance.now() - t0 < GRACE + 700) onIgnored();
    }, GRACE);
  }

  root.classList.add('handoff');
  document.addEventListener('DOMContentLoaded', function () {             // after parsing: a let-through failure cannot blank the page
    location.replace(safari());                                          // tier 1
    watch(tier2);
    setTimeout(function () { root.classList.remove('handoff'); }, GRACE); // the webview keeps a normal page for the way back
  });

  function tier2() {
    root.classList.remove('handoff');
    var s = null;
    function down(e) { var p = e.touches[0]; s = { x: p.clientX, y: p.clientY, t: e.timeStamp }; }
    function up(e) {
      if (!s) return;
      var p = e.changedTouches[0], dx = p.clientX - s.x, dy = p.clientY - s.y;
      var tap = Math.abs(dx) < 10 && Math.abs(dy) < 10 && e.timeStamp - s.t < 500;
      s = null;
      if (!tap && dy > -40) return;                                      // a tap, or an upward swipe
      removeEventListener('touchstart', down, true);
      removeEventListener('touchend', up, true);
      location.href = safari(placeOf(e.target));                         // synchronous, inside touchend: carries the gesture
      watch(function () { root.classList.add('handoff-ignored'); });     // tier 3
    }
    addEventListener('touchstart', down, { capture: true, passive: true });
    addEventListener('touchend', up, { capture: true, passive: true });
  }
})();
</script></head><body><main class="w"><h1>Viktor Dune, 23</h1><p class="handoff-line">Best In Safari · Tap ••• Above, Then Open In Browser</p><div class="cards"><div id="print-1"></div><div id="print-2"></div><div id="print-3"></div><div id="print-4"></div><div id="print-5"></div><div id="print-6"></div><div id="print-7"></div><div id="print-8"></div></div></main></body></html>
