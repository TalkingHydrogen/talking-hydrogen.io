  let rx = 0, rv = 0, raf = 0, lt = 0;
  const lo = () => Math.min(0, innerWidth - rowEl.scrollWidth);
  const band = n => n > 0 ? n * .3 : n < lo() ? lo() + (n - lo()) * .3 : n;
  let rr = 0;
  const put = n => { rx = n; rowEl.style.transform = 'translate3d(' + n.toFixed(1) + 'px,0,0)'; };
  function rowDrag(d) { cancelAnimationFrame(raf); const now = performance.now(), dt = Math.min(64, Math.max(4, now - lt)); rv = d / dt * 16.7; lt = now; rr += d; put(band(rr)); }
  function rowRelease(fling) {
    cancelAnimationFrame(raf); if (!fling || performance.now() - lt > 80) rv = 0;
    const step = () => {
      const L0 = lo();
      if (rx > 0 || rx < L0) { const t = rx > 0 ? 0 : L0, n = rx + (t - rx) * .18; rv = 0; put(Math.abs(t - n) < .5 ? t : n); rr = rx; if (rx !== t) raf = requestAnimationFrame(step); return; }
      rv *= .95; put(rx + rv); rr = rx;
      if (Math.abs(rv) > .2) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  /* ---------- the site's own two-finger pinch on the photo (Photos-style: it follows both fingers, springs back) ---------- */
  const PZ = { ptrs: new Map(), on: false, el: null, d0: 0, m0: null, s: 1, max: 1, cancelled: 0, last: '' };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  function pzWrite(tx, ty, s) { PZ.el.style.transition = 'none'; PZ.el.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(' + s.toFixed(3) + ')'; }
  function pzEnd(why) {
    if (!PZ.on) return;
    PZ.on = false; PZ.last = why + ' · peak ×' + PZ.max.toFixed(2);
    log('site pinch ' + why + ' (peak ×' + PZ.max.toFixed(2) + ')');
    const el = PZ.el; el.style.transition = 'transform .38s cubic-bezier(.32,.72,0,1)'; el.style.transform = '';
  }

  /* ---------- one pointer router ---------- */
  let st = null;                                    // the row drag / tap pointer
  addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('.hud')) return;
    const phEl = e.target.closest && e.target.closest('.ph');
    if (phEl) {
      PZ.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, el: phEl });
      if (PZ.ptrs.size === 2) {
        const [a, b] = [...PZ.ptrs.values()];
        PZ.on = true; PZ.el = a.el.querySelector('img'); PZ.d0 = dist(a, b) || 1; PZ.m0 = mid(a, b); PZ.s = 1; PZ.max = 1;
        st = null; log('site pinch: 2 fingers on the photo');
        return;
      }
    }
    if (PZ.ptrs.size > 1) return;
    st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: e.timeStamp, axis: null };
    cancelAnimationFrame(raf);
  }, { passive: true });
  addEventListener('pointermove', e => {
    const p = PZ.ptrs.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }
    if (PZ.on && PZ.ptrs.size >= 2) {
      const [a, b] = [...PZ.ptrs.values()], m = mid(a, b);
      PZ.s = Math.max(.6, dist(a, b) / PZ.d0); PZ.max = Math.max(PZ.max, PZ.s);
      pzWrite(m.x - PZ.m0.x, m.y - PZ.m0.y, PZ.s);
      return;
    }
    if (!st || e.pointerId !== st.id || openEl.classList.contains('on')) return;
    const dx = e.clientX - st.lx, dy = e.clientY - st.ly; st.lx = e.clientX; st.ly = e.clientY;
    if (!st.axis) { if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 10) return; st.axis = Math.abs(e.clientX - st.x0) >= Math.abs(e.clientY - st.y0) ? 'x' : 'y'; }
    if (st.axis === 'x') rowDrag(dx); else if (locked || !L.tall) rowDrag(-dy);
  }, { passive: true });
  function up(e, cancel) {
    if (PZ.ptrs.has(e.pointerId)) {
      PZ.ptrs.delete(e.pointerId);
      if (PZ.on && PZ.ptrs.size < 2) {
        if (cancel) PZ.cancelled++;
        pzEnd(cancel ? 'CANCELLED by Safari (pointercancel)' : 'released');
        st = null; return;
      }
    }
    if (!st || e.pointerId !== st.id) return;
    const moved = Math.hypot(e.clientX - st.x0, e.clientY - st.y0), s0 = st; st = null;
    if (cancel) { rowRelease(false); return; }
    if (moved < 10 && e.timeStamp - s0.t0 < 600) {                          // a tap
      if (openEl.classList.contains('on')) { closeOpen(false); log('tap → close'); if (SG) SG.viewClosed(); return; }
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (el && el.closest && el.closest('.ph')) openNow();
      return;
    }
    rowRelease(true);
  }
  addEventListener('pointerup', e => up(e, false), { passive: true });
  addEventListener('pointercancel', e => up(e, true), { passive: true });

  /* ---------- the readout ---------- */
  const hud = document.createElement('div'); hud.className = 'hud';
  const LAY = [['ta', 'touch-action'], ['ge', 'gesture'], ['tm', '2-finger'], ['dt', 'dbl-tap'], ['hist', 'history'], ['meta', 'max-scale'], ['os', 'overscroll'], ['lock', 'lock'], ['imgpe', 'img hit'], ['edgepd', 'edge pd']];
  const layLink = ([k, n]) => {
    if (k === 'hist') { const q = new URLSearchParams(location.search), c = q.get('hist') === '0' ? '0' : q.get('hist') === 'view' ? 'view' : 'both';
      const nx = c === 'both' ? 'view' : c === 'view' ? '0' : null; if (nx) q.set('hist', nx); else q.delete('hist');
      return '<a href="?' + q.toString() + '" class="' + (c === '0' ? 'off' : '') + '">history:' + (c === '0' ? 'off' : c) + '</a>'; }
    const q = new URLSearchParams(location.search), def = k !== 'edgepd', cur = k === 'edgepd' ? q.get(k) === '1' : q.get(k) !== '0';
    if (def) { if (cur) q.set(k, '0'); else q.delete(k); } else { if (cur) q.delete(k); else q.set(k, '1'); }
    return '<a href="?' + q.toString() + '" class="' + (cur ? '' : 'off') + '">' + n + '</a>';
  };
  hud.innerHTML = '<div class="t">' + L.title + '<span class="btn" id="hmin">min</span><span class="btn" id="hcopy">copy report</span><a href="./">‹ lab</a></div>' +
    '<div class="x"><div class="do">' + (L.todo || '') + '</div><div id="hrows"></div>' +
    (GUARD ? '<div class="lay"><span class="k">layers (tap to toggle): </span>' + LAY.map(layLink).join('') + '</div>' : '') +
    '<div class="log" id="hlog"></div></div>';
  document.body.appendChild(hud);
  logEl = $('hlog');
  $('hmin').onclick = () => hud.classList.toggle('min');
  $('hcopy').onclick = () => {
    const rep = JSON.stringify({ v: L.v, url: location.href, ua, kind: KIND, m: measure(), guard: SG ? { stats: SG.stats, zoomed: SG.zoomed, armed: SG.armed } : null, pinch: PZ.last, log: LOG.slice(-60) }, null, 1);
    const ok = () => log('report copied (paste it in the chat)');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(rep).then(ok, () => prompt('Copy:', rep)); else prompt('Copy:', rep);
  };
  if (Q.get('hud') === 'min') hud.classList.add('min');

  function measure() {
    const vv = window.visualViewport, E = window.__sgEmu;
    const s = E && E.scale ? E.scale : vv ? vv.scale : 1;
    return { scale: +s.toFixed(3), vv: vv ? [Math.round(vv.width), Math.round(vv.height), Math.round(vv.offsetLeft), Math.round(vv.offsetTop)] : null,
      inner: [innerWidth, innerHeight], hist: history.length, state: history.state, bars: barsNow, locked, land: innerWidth > innerHeight,
      sy: Math.round(scrollY), dpr: devicePixelRatio, screen: [screen.width, screen.height] };
  }
  const hrows = $('hrows');
  let prev = '';
  function paint() {
    const m = measure(), z = Math.abs(m.scale - 1) > .01;
    const rows = [
      '<span class="k">zoom</span> <b class="' + (z ? 'no' : 'ok') + '">×' + m.scale.toFixed(2) + '</b>' + (z ? ' <span class="no">(zoomed' + (SG ? ': guard stands down' : '') + ')</span>' : '') +
        ' <span class="k">· visual</span> ' + (m.vv ? m.vv[0] + '×' + m.vv[1] + ' +' + m.vv[2] + ',' + m.vv[3] : '–') + ' <span class="k">· inner</span> ' + m.inner.join('×'),
      '<span class="k">history</span> ' + m.hist + (SG ? (SG.opts.history ? ' · ' + SG.opts.history + ' · ' + (SG.armed ? '<span class="ok">on our entry (' + (history.state && history.state.sg) + '): a back swipe stays here</span>' : '<span class="no">' + (SG.opts.history === 'both' ? 'not armed: tap once' : 'home: back leaves') + '</span>') : ' · catcher off') : ' · ' + (history.state ? 'state set' : 'no catcher')),
      '<span class="k">bars</span> ' + m.bars + (L.lock ? ' · lock ' + (locked ? '<span class="ok">ON</span>' : 'off') : '') + ' · ' + (m.land ? 'landscape' : 'portrait') + ' · scroll ' + m.sy,
      '<span class="k">site pinch</span> ' + (PZ.on ? '<b class="ok">×' + PZ.s.toFixed(2) + ' · 2 fingers</b>' : (PZ.last || '–')) + (PZ.cancelled ? ' <span class="no">· cancelled ' + PZ.cancelled + '×</span>' : ''),
      '<span class="k">last guard</span> ' + (SG ? (SG.last || '–') : 'none (unguarded)'),
      '<span class="k">browser</span> ' + KIND + (SV ? ' ' + SV : '') + ' · dpr ' + m.dpr + ' · screen ' + m.screen.join('×')
    ];
    const k = rows.join('|');
    if (k !== prev) { prev = k; hrows.innerHTML = rows.map(r => '<div>' + r + '</div>').join(''); }
  }

  /* ---------- the loop ---------- */
  let prevBars = null, prevSY = 0;
  function tick() {
    barsNow = bars();
    const want = !!L.lock && Q.get('lock') !== '0' && barsNow !== 'showing';
    if (want !== locked) { locked = want; log(want ? 'lock ON (bars ' + barsNow + '): no scroll reaches Safari' : 'lock off (bars ' + barsNow + ')'); }
    if (barsNow !== prevBars) { if (prevBars !== null) log('bars → ' + barsNow); prevBars = barsNow; }
    const sy = Math.round(scrollY); if (Math.abs(sy - prevSY) > 40) { log('document scrolled → ' + sy); prevSY = sy; }
    paint();
    requestAnimationFrame(tick);
  }
  log('open · ' + KIND + (SV ? ' ' + SV : '') + ' · history ' + history.length + ' · zoom ×' + (window.visualViewport ? visualViewport.scale.toFixed(2) : '?') +
    ' · nav ' + ((performance.getEntriesByType('navigation')[0] || {}).type || '?'));
  requestAnimationFrame(tick);
  window.lab = { log, measure, LOG, rowTo: n => { cancelAnimationFrame(raf); rr = n; rv = 0; put(n); }, get locked() { return locked; }, PZ, openNow, closeOpen, isOpen: () => openEl.classList.contains('on') };
})();
</script></body></html>
